<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Icon Gallery</title>
    <link rel="icon" type="image/png" href="./images/PictureInsertFromFile.png" />
    <script src="./theme.js" type="text/javascript"></script>
    <link href="./ImageMso.css" rel="stylesheet" type="text/css" />
  </head>
  <body class="icon-detail-page">
    <button class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false" title="Switch theme">
      <img class="theme-icon-sun" src="./images/BrightnessMore.png" alt="" />
      <span class="theme-icon-moon" aria-hidden="true">&#9790;</span>
    </button>
    <main class="icon-detail">
      <a class="icon-detail-back icon-detail-back-with-icon" href="./ImageMso.html">
        <img src="./images/Undo.png" alt="" aria-hidden="true" />
        Back to gallery
      </a>
      <div class="icon-title-row">
        <h1 id="icon-name">Office Icon Gallery</h1>
        <button id="copy-icon-id" class="icon-copy-id" type="button" aria-label="Copy icon ID" title="Copy icon ID" disabled>
          <img src="./images/Copy.png" alt="" aria-hidden="true" />
        </button>
      </div>
      <p id="icon-image-status" class="icon-image-status" hidden></p>
      <div class="icon-detail-previews">
        <figure class="icon-detail-preview">
          <img id="icon-image" class="icon-detail-image" alt="" />
          <figcaption>Large preview</figcaption>
        </figure>
        <figure class="icon-detail-preview">
          <img id="icon-image-small" class="icon-detail-image-small" alt="" />
          <figcaption>Gallery size (32 x 32)</figcaption>
        </figure>
      </div>
      <div class="icon-detail-actions">
        <button id="copy-name" type="button" disabled>
          <img src="./images/Copy.png" alt="" aria-hidden="true" />
          Copy icon name
        </button>
        <div class="icon-download">
          <button id="download-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="download-menu" disabled>
          <img src="./images/FileSave.png" alt="" aria-hidden="true" />
            Download image
          </button>
          <div id="download-menu" class="icon-download-menu" role="menu" aria-label="Download format" hidden>
            <button type="button" role="menuitem" data-download-format="png">PNG</button>
            <button type="button" role="menuitem" data-download-format="ico">ICO</button>
            <button type="button" role="menuitem" data-download-format="jpeg">JPEG</button>
          </div>
        </div>
      </div>
      <p id="copy-status" role="status" aria-live="polite"></p>
      <p id="icon-error" role="alert" hidden></p>
      <section id="same-image-section" class="same-image-section" aria-labelledby="same-image-heading" hidden>
        <h2 id="same-image-heading">Other IDs using the same image</h2>
        <ul id="same-image-list" class="same-image-list"></ul>
      </section>
      <a class="icon-detail-back icon-detail-back-with-icon" href="./ImageMso.html">
        <img src="./images/Undo.png" alt="" aria-hidden="true" />
        Back to gallery
      </a>
    </main>
    <footer class="page-notice">All images remain the property of Microsoft. This independent reference is provided to help developers build ribbon interfaces for Office applications and is not affiliated with or endorsed by Microsoft.</footer>
    <script>
      const iconName = new URLSearchParams(window.location.search).get("name");
      const nameHeading = document.getElementById("icon-name");
      const iconImage = document.getElementById("icon-image");
      const smallIconImage = document.getElementById("icon-image-small");
      const copyButton = document.getElementById("copy-name");
      const copyIdButton = document.getElementById("copy-icon-id");
      const downloadButton = document.getElementById("download-button");
      const downloadMenu = document.getElementById("download-menu");
      const copyStatus = document.getElementById("copy-status");
      const imageStatus = document.getElementById("icon-image-status");
      const sameImageSection = document.getElementById("same-image-section");
      const sameImageList = document.getElementById("same-image-list");
      const errorMessage = document.getElementById("icon-error");
      const validIconName = iconName && /^[A-Za-z0-9_]+$/.test(iconName);

      if (validIconName) {
        document.title = `${iconName} | Office Icon Gallery`;
        nameHeading.textContent = iconName;
        iconImage.alt = iconName;
        smallIconImage.alt = iconName;
        const iconSource = `./images/${encodeURIComponent(iconName)}.png`;
        copyButton.disabled = false;
        copyIdButton.disabled = false;
        fetch("./icon-metadata.json")
          .then((response) => {
            if (!response.ok) {
              throw new Error("Could not load icon metadata");
            }
            return response.json();
          })
          .then((metadata) => {
            const icon = metadata.find((entry) => entry.name === iconName);
            if (icon?.imageStatus === "placeholder") {
              imageStatus.textContent = `Placeholder image: ${icon.placeholderLabel}. This is a shared Office fallback, not a unique icon image.`;
              imageStatus.hidden = false;
            }

            const metadataByName = new Map(metadata.map((entry) => [entry.name, entry]));
            const sameImageIds = (icon?.sameImageIds || [])
              .filter((name) => metadataByName.has(name));
            if (sameImageIds.length > 0) {
              const sameImageItems = sameImageIds.map((name) => {
                const item = document.createElement("li");
                const link = document.createElement("a");
                const image = document.createElement("img");
                const label = document.createElement("span");

                link.className = "same-image-link";
                link.href = `./Icon.html?name=${encodeURIComponent(name)}`;
                image.loading = "lazy";
                image.src = `./images/${encodeURIComponent(name)}.png`;
                image.alt = "";
                label.textContent = name;
                link.append(image, label);
                item.append(link);
                return item;
              });

              sameImageList.replaceChildren(...sameImageItems);
              sameImageSection.hidden = false;
            }
          })
          .catch((error) => console.error("Icon metadata could not be loaded", error));
        const handleIconError = () => {
          iconImage.hidden = true;
          smallIconImage.hidden = true;
          copyButton.disabled = true;
          copyIdButton.disabled = true;
          downloadButton.disabled = true;
          errorMessage.textContent = "That icon could not be found.";
          errorMessage.hidden = false;
        };
        iconImage.addEventListener("error", handleIconError);
        smallIconImage.addEventListener("error", handleIconError);
        iconImage.addEventListener("load", () => {
          downloadButton.disabled = false;
        });
        iconImage.src = iconSource;
        smallIconImage.src = iconSource;
      } else {
        errorMessage.textContent = "Choose an icon from the gallery to view it here.";
        errorMessage.hidden = false;
      }

      function copyUsingSelection() {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = iconName;
        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        const copied = document.execCommand("copy");
        temporaryInput.remove();
        return copied;
      }

      const copyIconId = async () => {
        if (!validIconName) {
          return;
        }

        copyStatus.textContent = "Copying icon ID...";
        try {
          if (!copyUsingSelection()) {
            if (!navigator.clipboard || !navigator.clipboard.writeText) {
              throw new Error("Clipboard access is unavailable");
            }
            await navigator.clipboard.writeText(iconName);
          }
          copyStatus.textContent = "Copied icon ID";
        } catch {
          copyStatus.textContent = "Could not copy the icon ID";
        }
      };

      copyButton.addEventListener("click", copyIconId);
      copyIdButton.addEventListener("click", copyIconId);

      function closeDownloadMenu() {
        downloadMenu.hidden = true;
        downloadButton.setAttribute("aria-expanded", "false");
      }

      downloadButton.addEventListener("click", () => {
        if (downloadButton.disabled) {
          return;
        }

        downloadMenu.hidden = !downloadMenu.hidden;
        downloadButton.setAttribute("aria-expanded", String(!downloadMenu.hidden));
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".icon-download")) {
          closeDownloadMenu();
        }
      });

      downloadMenu.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeDownloadMenu();
          downloadButton.focus();
        }
      });

      async function downloadIcon(format) {
        if (!validIconName || downloadButton.disabled) {
          return;
        }

        downloadButton.disabled = true;
        const extension = format === "jpeg" ? "jpg" : format;
        copyStatus.textContent = `Preparing ${extension.toUpperCase()} file...`;
        try {
          const response = await fetch(iconImage.src);
          if (!response.ok) {
            throw new Error("Could not load the icon image");
          }
          const pngBytes = new Uint8Array(await response.arrayBuffer());
          let fileBlob;

          if (format === "png") {
            fileBlob = new Blob([pngBytes], { type: "image/png" });
          } else if (format === "jpeg") {
            const sourceImage = await createImageBitmap(new Blob([pngBytes], { type: "image/png" }));
            const canvas = document.createElement("canvas");
            canvas.width = sourceImage.width;
            canvas.height = sourceImage.height;
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(sourceImage, 0, 0);
            sourceImage.close();
            fileBlob = await new Promise((resolve, reject) => {
              canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("JPEG encoding failed")), "image/jpeg", 0.92);
            });
          } else if (format === "ico") {
            const pngView = new DataView(pngBytes.buffer, pngBytes.byteOffset, pngBytes.byteLength);
            const isPng = [137, 80, 78, 71, 13, 10, 26, 10].every((value, index) => pngBytes[index] === value);
            if (!isPng || pngBytes.length < 24) {
              throw new Error("The icon image is not a valid PNG");
            }

            const width = pngView.getUint32(16);
            const height = pngView.getUint32(20);
            if (width < 1 || width > 256 || height < 1 || height > 256) {
              throw new Error("ICO images must be no larger than 256 pixels");
            }

            const icoBytes = new Uint8Array(22 + pngBytes.length);
            const icoView = new DataView(icoBytes.buffer);
            icoView.setUint16(2, 1, true);
            icoView.setUint16(4, 1, true);
            icoBytes[6] = width === 256 ? 0 : width;
            icoBytes[7] = height === 256 ? 0 : height;
            icoView.setUint16(10, 1, true);
            icoView.setUint16(12, 32, true);
            icoView.setUint32(14, pngBytes.length, true);
            icoView.setUint32(18, 22, true);
            icoBytes.set(pngBytes, 22);
            fileBlob = new Blob([icoBytes], { type: "image/vnd.microsoft.icon" });
          } else {
            throw new Error("Unsupported image format");
          }

          const downloadUrl = URL.createObjectURL(fileBlob);
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = `${iconName}.${extension}`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
          copyStatus.textContent = `Downloaded ${iconName}.${extension}`;
        } catch {
          copyStatus.textContent = `Could not download the ${extension.toUpperCase()} file`;
        } finally {
          downloadButton.disabled = !iconImage.complete || iconImage.naturalWidth === 0;
        }
      }

      downloadMenu.addEventListener("click", (event) => {
        const formatButton = event.target.closest("[data-download-format]");
        if (!formatButton) {
          return;
        }

        closeDownloadMenu();
        downloadIcon(formatButton.dataset.downloadFormat);
      });
    </script>
  </body>
</html>
