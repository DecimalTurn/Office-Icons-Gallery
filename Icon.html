<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Icon Gallery</title>
    <link rel="icon" type="image/png" href="./images/PictureInsertFromFile.png" />
    <script src="./theme.js" type="text/javascript"></script>
    <link href="./ImageMso.css" rel="stylesheet" type="text/css" />
  </head>
  <body class="icon-detail-page">
    <button class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false" title="Switch theme">
      <img class="theme-icon-sun" src="./images/BrightnessMore.png" alt="" />
      <span class="theme-icon-moon" aria-hidden="true">&#9790;</span>
    </button>
    <main class="icon-detail">
      <a class="icon-detail-back icon-detail-back-with-icon" href="./ImageMso.html">
        <img src="./images/Undo.png" alt="" aria-hidden="true" />
        Back to gallery
      </a>
      <h1 id="icon-name">Office Icon Gallery</h1>
      <div class="icon-detail-previews">
        <figure class="icon-detail-preview">
          <img id="icon-image" class="icon-detail-image" alt="" />
          <figcaption>Large preview</figcaption>
        </figure>
        <figure class="icon-detail-preview">
          <img id="icon-image-small" class="icon-detail-image-small" alt="" />
          <figcaption>Gallery size (32 x 32)</figcaption>
        </figure>
      </div>
      <button id="copy-name" type="button" disabled>
        <img src="./images/Copy.png" alt="" aria-hidden="true" />
        Copy icon name
      </button>
      <p id="copy-status" role="status" aria-live="polite"></p>
      <p id="icon-error" role="alert" hidden></p>
      <a class="icon-detail-back icon-detail-back-with-icon" href="./ImageMso.html">
        <img src="./images/Undo.png" alt="" aria-hidden="true" />
        Back to gallery
      </a>
    </main>
    <footer class="page-notice">All images remain the property of Microsoft. This independent reference is provided to help developers build ribbon interfaces for Office applications and is not affiliated with or endorsed by Microsoft.</footer>
    <script>
      const iconName = new URLSearchParams(window.location.search).get("name");
      const nameHeading = document.getElementById("icon-name");
      const iconImage = document.getElementById("icon-image");
      const smallIconImage = document.getElementById("icon-image-small");
      const copyButton = document.getElementById("copy-name");
      const copyStatus = document.getElementById("copy-status");
      const errorMessage = document.getElementById("icon-error");
      const validIconName = iconName && /^[A-Za-z0-9_]+$/.test(iconName);

      if (validIconName) {
        document.title = `${iconName} | Office Icon Gallery`;
        nameHeading.textContent = iconName;
        iconImage.alt = iconName;
        smallIconImage.alt = iconName;
        const iconSource = `./images/${encodeURIComponent(iconName)}.png`;
        iconImage.src = iconSource;
        smallIconImage.src = iconSource;
        copyButton.disabled = false;
        const handleIconError = () => {
          iconImage.hidden = true;
          smallIconImage.hidden = true;
          copyButton.disabled = true;
          errorMessage.textContent = "That icon could not be found.";
          errorMessage.hidden = false;
        };
        iconImage.addEventListener("error", handleIconError);
        smallIconImage.addEventListener("error", handleIconError);
      } else {
        errorMessage.textContent = "Choose an icon from the gallery to view it here.";
        errorMessage.hidden = false;
      }

      function copyUsingSelection() {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = iconName;
        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        const copied = document.execCommand("copy");
        temporaryInput.remove();
        return copied;
      }

      copyButton.addEventListener("click", async () => {
        if (!validIconName) {
          return;
        }

        copyStatus.textContent = "Copying icon name...";
        try {
          if (!copyUsingSelection()) {
            if (!navigator.clipboard || !navigator.clipboard.writeText) {
              throw new Error("Clipboard access is unavailable");
            }
            await navigator.clipboard.writeText(iconName);
          }
          copyStatus.textContent = "Copied icon name";
        } catch {
          copyStatus.textContent = "Could not copy the icon name";
        }
      });
    </script>
  </body>
</html>
